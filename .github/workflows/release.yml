name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v ./...

    - name: Run benchmarks
      run: go test -bench=. -benchmem -run=^$ ./...

    - name: Generate coverage report
      run: go test -coverprofile=coverage.out -covermode=atomic ./...

    - name: Create release archives
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        mkdir -p release
        go doc -all > release/doc.txt
        go tool cover -html=coverage.out -o release/coverage.html
        cp coverage.out readme.md CHANGELOG.md LICENSE go.mod release/
        tar -czf "float-${VERSION}.tar.gz" release/

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ github.ref_name }}
      run: |
        gh release create "$VERSION" "float-${VERSION}.tar.gz" \
          --verify-tag \
          --title "Release $VERSION" \
          --notes "## Changes

        See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

        ## Installation

        \`\`\`bash
        go get github.com/jenska/float@${VERSION}
        \`\`\`"
